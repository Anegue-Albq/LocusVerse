server:
  port: 8082

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: locusverse

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
#      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

jwt:
  expiration: ${JWT_EXPIRATION:900000} #15 minutes
  key: ${JWT_KEY}
