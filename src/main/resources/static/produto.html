<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto - LocusVerso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/produtos.css" />
</head>
<body class="theme-light">
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
  <p class="sr-only" role="status" aria-live="polite" data-live-region></p>

  <header class="site-header site-header--light">
    <div class="container">
      <a class="logo" href="index.html" aria-label="LocusVerso - página inicial">
        <img class="logo__image" src="assets/logo-locusverso.png" alt="" />
      </a>
      <nav aria-label="Navegação do produto">
        <a class="btn btn-outline back-button" href="produtos.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Voltar ao catálogo</span>
        </a>
      </nav>
      <a class="icon-link" href="carrinho.html">
        <span class="sr-only">Carrinho,</span><span aria-hidden="true">Carrinho</span>
        <span class="cart-count" data-cart-count aria-hidden="true">0</span>
        <span class="sr-only" data-cart-count-sr>0 itens no carrinho</span>
      </a>
    </div>
  </header>

  <main id="conteudo-principal">
    <section class="product-detail-section">
      <div class="container product-detail" data-product-detail></div>
    </section>
    <section class="product-reviews-section">
      <div class="container product-reviews" data-product-reviews></div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
